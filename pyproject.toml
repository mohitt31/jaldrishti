[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jaldrishti"
version = "0.2.0"
description = "Cited groundwater arsenic and fluoride evidence for West Bengal, found with SerpApi and checked against the source page"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["requests>=2.31", "pdfplumber>=0.11", "truststore>=0.9"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jaldrishti = "jaldrishti.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
