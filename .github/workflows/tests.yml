name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Benchmark files and cache are consistent
        run: |
          python - <<'PY'
          import csv, json, glob
          facts = {r["fact_id"] for r in csv.DictReader(open("benchmark/jaldrishti_facts.csv", encoding="utf-8"))}
          qs = list(csv.DictReader(open("benchmark/jaldrishti_questions.csv", encoding="utf-8")))
          assert len(facts) == 60 and len(qs) == 30
          for q in qs:
              assert all(f in facts for f in q["supporting_fact_ids"].split(";") if f), q["question_id"]
          assert len(glob.glob("cache/serpapi/*.json")) > 0
          print("ok:", len(facts), "facts,", len(qs), "questions")
          PY
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install browser checker
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.62.1
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check desktop/mobile Python parity and site interactions
        env:
          BROWSER_CHANNEL: chromium
          QA_OUTPUT: reports/browser_release/ci_browser_qa.json
          SCREENSHOT_DIR: work/ci-screenshots
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory docs > "$RUNNER_TEMP/jaldrishti-site.log" 2>&1 &
          export NODE_PATH="$RUNNER_TEMP/browser/node_modules"
          node --test tests/note.test.mjs
          PILOT_QA_OUTPUT=work/pilot/ci-form-qa.json node scripts/check_pilot.cjs
          node scripts/check_browser.cjs
          DESIGN_QA_OUTPUT=reports/design_release/ci_browser_qa.json DESIGN_SCREENSHOTS=work/ci-design-screenshots node scripts/check_design.cjs
          WORKFLOW_QA_OUTPUT=reports/workflow_release/ci_browser_qa.json WORKFLOW_SCREENSHOTS=work/ci-workflow-screenshots node scripts/check_workflow.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-engineering-checks
          path: |
            reports/browser_release/ci_browser_qa.json
            work/ci-screenshots
            reports/workflow_release/ci_browser_qa.json
            work/ci-workflow-screenshots
            reports/design_release/ci_browser_qa.json
            work/ci-design-screenshots
