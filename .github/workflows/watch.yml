name: source-watch
on:
  schedule: [{cron: "30 3 * * 1"}]   # Mondays 09:00 IST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e .
      - name: Search for new sources (skips without the secret)
        env: {SERPAPI_KEY: "${{ secrets.SERPAPI_KEY }}"}
        run: python scripts/watch_sources.py
      - name: Commit the watch report if it changed
        run: |
          git config user.name "source-watch"
          git config user.email "source-watch@users.noreply.github.com"
          git add reports/watch 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Source watch $(date -u +%F)" && git push || true
